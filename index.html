
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b16">
  <title>Jellycade Hub</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b0b16;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 700px);
      padding: 48px 24px;
      text-align: center;
      border: 1px solid #343052;
      border-radius: 24px;
      background: linear-gradient(145deg, #19152e, #10101c);
      box-shadow: 0 20px 80px #0008;
    }

    .logo { font-size: 52px; }

    h1 {
      margin: 12px 0;
      font-size: clamp(36px, 8vw, 58px);
      letter-spacing: -2px;
    }

    p {
      color: #c6c2df;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 15px 25px;
      border-radius: 12px;
      background: #8662ff;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background .2s, transform .2s;
    }

    .button:hover {
      background: #a08aff;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 36px;
      color: #85819f;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">🎮</div>
    <h1>Jellycade Hub</h1>
    <p>Your gaming hub. One place.</p>
    <p>Launch Jellycade through your Hub.</p>

    <a class="button" href="/en">
      Explore Jellycade →
    </a>

    <footer>Jellycade Hub · Independent project</footer>
  </main>
</body>
</html>
